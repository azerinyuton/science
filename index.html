---
layout: default
title: Home
---

<h2 style="color: var(--dark); border-bottom: 3px solid var(--primary); display: inline-block;">Latest Insights</h2>

{% for post in site.posts %}
<div class="post-card">
    <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    
<div style="display: flex; align-items: center; margin-bottom: 10px; gap: 15px;">
    <span style="font-size: 0.85rem; color: #888;">📅 {{ post.date | date: "%B %d, %Y" }}</span>
    
    <span style="font-size: 0.85rem; color: #888; margin-left: 10px;">
    | 👁️ <span id="busuanzi_value_page_pv">...</span> views
</span>

<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>
  walinePageView({
    serverURL: 'https://waline-test-3f8id7p82-azerinyuton.vercel.app', // Bu müvəqqəti test serveridir
    update: true
  });
</script>
</div>

    <p>{{ post.content | strip_html | truncatewords: 25 }}</p>
    <a href="{{ post.url | relative_url }}" class="read-more">Read Article →</a>
</div>
{% endfor %}
