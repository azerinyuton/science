<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Science Portal</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <style>
        :root { --primary: #2A9D8F; --dark: #264653; --light: #F4F1DE; }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 0; line-height: 1.6; color: #333; 
            overflow-x: hidden; width: 100%;
        }
        header { background: var(--dark); color: white; padding: 60px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 2.5rem; letter-spacing: 2px; }
        nav { margin-top: 20px; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; opacity: 0.8; }
        nav a:hover { opacity: 1; color: var(--primary); }
        
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        
        /* Search Box */
        .search-container { margin-bottom: 40px; }
        #search-input { 
            width: 100%; padding: 12px 20px; border: 2px solid var(--primary); 
            border-radius: 25px; outline: none; font-size: 1rem;
        }
        #results-container { list-style: none; padding: 0; }
        #results-container li { background: #f9f9f9; margin-bottom: 5px; padding: 10px; border-radius: 8px; }

        /* Post Cards */
        .post-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 5px solid var(--primary); }
        .post-card h2 { margin-top: 0; color: var(--dark); }
        .post-card h2 a { text-decoration: none; color: inherit; }
        .meta { font-size: 0.85rem; color: #888; margin-bottom: 15px; }
        .read-more { display: inline-block; margin-top: 15px; color: var(--primary); font-weight: bold; text-decoration: none; }

        /* Mobile Fixes */
        @media (max-width: 600px) {
            header { padding: 40px 10px; }
            header h1 { font-size: 1.8rem; }
            .container { margin: 20px auto; }
            .post-card { padding: 15px; }
        }
    </style>
</head>
<body>

<header>
    <h1>SCIENCE PORTAL</h1>
    <nav>
        <a href="{{ site.baseurl }}/">Home</a>
        <a href="{{ site.baseurl }}/about/">About</a>
    </nav>
</header>

<div class="container">
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search for scientific insights...">
        <ul id="results-container"></ul>
    </div>

    {{ content }}
</div>

<script src="https://unpkg.com/simple-jekyll-search@latest/dest/simple-jekyll-search.min.js"></script>
<script>
  SimpleJekyllSearch({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    json: '{{ site.baseurl }}/search.json',
    searchResultTemplate: '<li><a href="{url}">{title}</a> <small>{date}</small></li>',
    noResultsText: 'No results found.',
    limit: 10
  })
</script>

</body>
</html>
