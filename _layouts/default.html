<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        :root { --primary: #1abc9c; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; color: #333; line-height: 1.6; }
        header { background: var(--dark); color: white; padding: 2rem 5%; text-align: center; }
        nav ul { list-style: none; padding: 0; }
        nav ul li { display: inline; margin: 0 15px; }
        nav ul li a { color: white; text-decoration: none; font-weight: bold; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        .post-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .post-card h2 a { color: var(--dark); text-decoration: none; }
        .post-card h2 a:hover { color: var(--primary); }
        .read-more { background: var(--primary); color: white; padding: 8px 18px; border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 10px; }
        footer { text-align: center; padding: 20px; color: #777; font-size: 0.9rem; }
        .view-count {
    font-size: 0.85rem;
    color: #777;
    margin-left: 10px;
    display: inline-flex;
    align-items: center;
}
.view-count img {
    margin: 0 5px 0 0 !important; /* İkon üçün boşluq */
    box-shadow: none !important; /* İkona kölgə verməsin */
    display: inline !important;
}
        @media (max-width: 600px) {
    header h1 { font-size: 1.8rem; }
    nav ul li { margin: 0 10px; }
    .post-card { padding: 15px; }
    input#search-input { font-size: 0.9rem; }
}
        /* Mobile and Tablet Optimization */
@media (max-width: 768px) {
    header { padding: 30px 10px; }
    header h1 { font-size: 1.8rem; }
    
    .container { 
        width: 95% !important; 
        padding: 10px; 
    }

    /* Axtarış çubuğunun telefonda kənardan çıxmaması üçün */
    #search-input { 
        width: 100% !important; 
        font-size: 14px; 
    }

    .post-card h2 { font-size: 1.3rem; }
    
    nav ul li { margin: 0 10px; }
}

/* Axtarış qutusu üçün ümumi düzəliş */
#search-input {
    box-sizing: border-box; /* Padding-in ölçüyə təsir etməməsi üçün mütləqdir */
}
    </style>
</head>
<body>
    <header>
        <h1>SCIENCE PORTAL</h1>
        <nav>
        <ul>
            <li><a href="{{ site.baseurl }}/">Home</a></li>
            <li><a href="{{ site.baseurl }}/about/">About</a></li>
        </ul>
        </nav>    
    </header>
    <div style="max-width: 900px; margin: 30px auto; padding: 0 20px; text-align: center;">
    <input type="text" id="search-input" placeholder="Search for scientific insights..." 
           style="width: 100%; padding: 12px 20px; border: 2px solid var(--primary); border-radius: 25px; outline: none; font-size: 1rem;">
    <ul id="results-container" style="list-style: none; padding: 0; margin-top: 10px; text-align: left;"></ul>
</div>

<script src="https://unpkg.com/simple-jekyll-search@latest/dest/simple-jekyll-search.min.js"></script>

<script>
  window.simpleJekyllSearch = SimpleJekyllSearch({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    json: '{{ site.baseurl }}/search.json',
    searchResultTemplate: '<li style="background: white; padding: 10px; border-bottom: 1px solid #eee;"><a href="{url}" style="color: var(--dark); text-decoration: none; font-weight: bold;">{title}</a> <small style="color: #888;">({date})</small></li>',
    noResultsText: '<li style="padding: 10px; color: #888;">No results found in our database.</li>',
    limit: 10,
    fuzzy: false
  })
</script>
    <div class="container">
        {{ content }}
    </div>
    <footer>© 2026 Science Portal - Azəri Nyuton</footer>
</body>

</html>
